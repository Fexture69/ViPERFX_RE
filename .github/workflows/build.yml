name: Build ViPERFX_RE Magisk Module

on:
  push:
    branches: [ dev, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ dev, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Libraries & Magisk Module
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Locate Android NDK
        run: |
          if [ -d "$ANDROID_SDK_ROOT/ndk" ] && [ "$(ls -A $ANDROID_SDK_ROOT/ndk 2>/dev/null)" ]; then
            LATEST_NDK=$(ls -1d $ANDROID_SDK_ROOT/ndk/* | sort -V | tail -n 1)
            echo "ANDROID_NDK_HOME=$LATEST_NDK" >> $GITHUB_ENV
            echo "ANDROID_NDK_ROOT=$LATEST_NDK" >> $GITHUB_ENV
            echo "Found pre-installed NDK at: $LATEST_NDK"
          else
            echo "Installing latest NDK via sdkmanager..."
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006"
            echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.1.12297006" >> $GITHUB_ENV
            echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.1.12297006" >> $GITHUB_ENV
          fi

      - name: Build Libraries & Package Magisk Module
        run: |
          python build_module.py

      - name: Upload Module Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViPER4Android-RE-Module
          path: out/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
